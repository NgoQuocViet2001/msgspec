[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "msgspec-pcre2"
version = "0.1.0"
description = "Optional native PCRE2 backend for msgspec pattern validation."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause AND (BSD-3-Clause WITH PCRE2-exception) AND BSD-2-Clause"
license-files = ["LICENSE", "vendor/pcre2/LICENCE.md", "vendor/pcre2/deps/sljit/LICENSE"]

[tool.setuptools]
py-modules = []
