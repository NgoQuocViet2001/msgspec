[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-* cp314t-* cp315-* cp315t*"
build-frontend = "build[uv]"
before-test = "python -m pip install --no-deps --no-index --find-links={project}/wheelhouse msgspec"
test-command = "python -m pytest {project}/tests/unit/test_pattern_acceleration.py"
test-requires = ["pytest>=9"]
test-environment = { MSGSPEC_TEST_PCRE2="1" }

[tool.cibuildwheel.pyodide]
build = "cp314-*"
